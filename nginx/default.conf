# ReelTalk nginx — plain HTTP on :3030. TLS termination is the operator's
# responsibility (reverse proxy in front, forwarding X-Forwarded-Proto).
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    client_max_body_size 100m;

    server {
        listen 3030;
        server_name _;

        # Collected static files (Django manifest storage paths)
        location /static/ {
            alias /app/static/;
        }

        # User-uploaded media (posters, avatars)
        location /images/ {
            alias /app/images/;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Pass the real protocol through instead of hardcoding it, so an
            # operator TLS proxy in front is handled correctly.
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
