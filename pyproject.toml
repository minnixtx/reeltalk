[project]
name = "reeltalk"
version = "0.1.0"
description = "A federated social network for tracking, reviewing, and discovering films."
license = "AGPL-3.0-only"
requires-python = ">=3.12"

# Lean v0.1 dependency set — every package license-audited for AGPLv3
# compatibility in PLAN.md §4 (audit date 2026-09-05, refreshed by the stack
# audit in §3.9). Re-verify before adding anything new. The task queue is
# deliberately absent: M1 has zero background tasks; Django-Q2 lands with M2
# (PLAN.md §3.9, decision R4).
#
# Runtime deps live in [project.dependencies], not a group named "main": PEP 735
# reserves that name for this table, and uv silently skips a custom
# `[dependency-groups] main` (pip accepted it — the M0 layout broke on the
# switch to uv).
dependencies = [
    "Django==6.1.1",
    "psycopg[binary]==3.3.5",
    "uvicorn==0.52.4",
    "whitenoise==6.12.0",
    "Pillow==12.3.0",
    "requests==2.34.2",
    "bleach==6.4.0",
    "mistune==3.3.4",
    "django-csp==4.0",
    "environs==15.2.0",
    "python-dateutil==2.9.0.post0",
    "django-pgtrigger==4.17.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "pytest-env==1.7.0",
    "pytest-xdist==3.8.0",
    "responses==0.26.3",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "django-stubs[compatible-mypy]==6.1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "reeltalk.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--cov=reeltalk"
testpaths = ["reeltalk/tests"]

env = [
    "SECRET_KEY = beepbeep",
    "DEBUG = true",
    "DOMAIN = localhost",
    "ALLOWED_HOSTS = localhost",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# extend-exclude (not exclude) so ruff's defaults — .venv, node_modules, ... —
# still apply; the venv lives inside /app in this image.
extend-exclude = ["migrations", "**/__init__.py"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes (critical errors only)
    "I", # isort
    "UP", # pyupgrade
]

[tool.mypy]
namespace_packages = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "reeltalk.settings"

# Strict mypy scope widens as the codebase matures (M1+).
[[tool.mypy.overrides]]
ignore_errors = true
module = ["reeltalk.*"]
