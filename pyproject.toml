[project]
name = "reeltalk"
version = "0.1.0"
description = "A federated social network for tracking, reviewing, and discovering films."
license = "AGPL-3.0-only"
requires-python = ">=3.11"

# Lean v0.1 dependency set — every package license-audited for AGPLv3
# compatibility in PLAN.md §4 (audit date 2026-09-05). Re-verify before
# adding anything new. Pins mirror the proven legacy versions where the
# package is kept.
[dependency-groups]
main = [
    "Django==5.2.16",
    "psycopg[binary]==3.2.9",
    "gunicorn==25.0.3",
    "celery[redis]==5.6.2",
    "django-celery-beat==2.8.1",
    "redis==5.0.3",
    "hiredis==2.3.2",
    "Pillow==12.3.0",
    "requests==2.33.0",
    "bleach==6.4.0",
    "mistune==3.3.0",
    "django-csp==3.8",
    "environs==14.5.0",
    "python-dateutil==2.9.0.post0",
    "django-pgtrigger==4.17.0",
]
dev = [
    "pytest==9.0.3",
    "pytest-django==4.8.0",
    "pytest-cov==5.0.0",
    "pytest-env==1.1.3",
    "pytest-xdist==3.5.0",
    "responses==0.25.0",
    "ruff==0.14.7",
    "mypy==1.7.1",
    "django-stubs[compatible-mypy]==4.2.7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "reeltalk.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--cov=reeltalk"
testpaths = ["reeltalk/tests"]

env = [
    "SECRET_KEY = beepbeep",
    "DEBUG = true",
    "DOMAIN = localhost",
    "ALLOWED_HOSTS = localhost",
    "CELERY_BROKER_URL = memory://",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["migrations", "**/__init__.py"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes (critical errors only)
]
ignore = [
    "E501", # line too long
    "E722", # bare except
    "E731", # lambda assignment
    "F405", # `env` may be undefined, or defined via star imports
]

[tool.mypy]
namespace_packages = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "reeltalk.settings"

# Strict mypy scope widens as the codebase matures (M1+).
[[tool.mypy.overrides]]
ignore_errors = true
module = ["reeltalk.*"]
