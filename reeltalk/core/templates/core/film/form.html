{% extends "base.html" %}

{% block title %}{% if film %}Edit {{ film.title }}{% else %}New film{% endif %}{% endblock %}

{% block content %}
<h1>{% if film %}Edit “{{ film.title }}”{% else %}New film{% endif %}</h1>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">{% if film %}Save changes{% else %}Create film{% endif %}</button>
</form>
{% endblock %}
