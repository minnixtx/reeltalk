{% extends "base.html" %}

{% block title %}ReelTalk{% endblock %}

{% block content %}
<h1>ReelTalk</h1>
<p>A federated home for tracking, reviewing, and discovering films.</p>
{% if user.is_authenticated %}
  <p>Signed in as <strong>{{ user.localname }}</strong>.</p>
{% else %}
  <p><a href="{% url 'signup' %}">Sign up</a> to get started.</p>
{% endif %}
{% endblock %}
