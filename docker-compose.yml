# ReelTalk dev stack — the leanest shape that works (PLAN.md §3.8/§3.9):
#   M1: web + db. The web container serves the site AND static/media itself
#       (uvicorn + whitenoise) on WEB_PORT (default 3030). TLS termination is
#       the operator's responsibility (decision D14).
#   M2+: a `worker` service (same image, Django-Q2 qcluster) joins for the
#        TMDB backfill task. No Redis, no nginx, no Celery at any milestone.
#
# All three volumes below are named, not host bind mounts, so there is no
# host-specific mount labelling to account for here.
name: reeltalk

x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "150m"
    max-file: "2"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    shm_size: ${POSTGRES_SHM_SIZE:-128mb}
    # The db receives only the Postgres variables, never the app's SMTP or API
    # secrets. These come from the interpolation layer (the project .env, or
    # --env-file), not from ${ENV_FILE}: a second local instance (federation
    # testing, R45) whose DB credentials differ from the project .env must also
    # pass --env-file .env.b, not just -e ENV_FILE=.env.b.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      # The application's own login, created once when the data directory is
      # first initialised. Empty POSTGRES_APP_USER means "no split": the app
      # keeps connecting as POSTGRES_USER, which is what installs predating the
      # change do. See db/role-split.sql.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
    healthcheck:
      # pg_isready only asks whether the server accepts connections; it never
      # authenticates, so rotating the bootstrap password (which the init script
      # does) cannot break this check.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Only read on a first boot, against an empty data directory. An install
      # that already has a database lands the split with db/upgrade-role-split.sh
      # instead. The `,z` is this box's SELinux label; it is a no-op elsewhere.
      - ./db/init-app-role.sh:/docker-entrypoint-initdb.d/60-reeltalk-app-role.sh:ro,z
      - ./db/role-split.sql:/usr/local/share/reeltalk/role-split.sql:ro,z
    networks:
      - main

  web:
    build: .
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    command: uvicorn reeltalk.asgi:application --host 0.0.0.0 --port 3030
    ports:
      # WEB_BIND unset (default) publishes on every interface, which is what
      # a deploy with no local reverse proxy needs. Set WEB_BIND=127.0.0.1
      # in .env when a proxy on this same host fronts the app.
      - "${WEB_BIND:-}${WEB_BIND:+:}${WEB_PORT:-3030}:3030"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/images
    healthcheck:
      # The forwarded-proto header is load-bearing once SECURE_SSL_REDIRECT
      # is on: a plain-HTTP probe would take the 301 and the container would
      # read unhealthy forever. Loopback is inside TRUSTED_PROXIES by
      # default, so the header is believed here and nowhere else.
      test: ["CMD-SHELL", "curl -f -H 'X-Forwarded-Proto: https' http://localhost:3030"]
      interval: 3s
      timeout: 1s
      # A cold first boot runs migrations + collectstatic before uvicorn binds,
      # and the worker gates on this check. A short grace period makes a slow
      # host fail `up` outright and leave the worker never started, rather than
      # just showing a transient yellow.
      start_period: 120s
      retries: 25
    depends_on:
      db:
        condition: service_healthy
    networks:
      - main

  # Worker role (M2): Django-Q2 qcluster from the same image. The entrypoint
  # only migrates + collectstatics when it starts uvicorn, so this waits for
  # web to be healthy — by then migrations have run and the django_q cluster
  # tables exist. No broker: the queue lives in Postgres (settings.Q_CLUSTER).
  worker:
    build: .
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    command: python manage.py qcluster
    volumes:
      # The backfill downloads posters into MEDIA_ROOT — must be the shared
      # volume or web can never serve them (2026-09-10 poster incident).
      - media_volume:/app/images
    depends_on:
      web:
        condition: service_healthy
    networks:
      - main

volumes:
  pgdata:
  static_volume:
  media_volume:

networks:
  main:
