# ReelTalk dev/alpha stack. Plain-HTTP endpoint on WEB_PORT (default 3030);
# TLS termination is the operator's responsibility (PLAN.md §3.8, decision D14).
#
# Host quirks this file already accounts for (see PLAN.md §6):
#   - :z on bind mounts (SELinux shared label; no-op on non-SELinux hosts)
#   - after ANY web rebuild: `docker compose restart nginx` (upstream DNS cache)
#   - web / celery_worker / celery_beat build SEPARATE image tags — when you
#     add or change Celery tasks, rebuild all three or the stale worker will
#     silently drop new tasks as "unregistered".
name: reeltalk

x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "150m"
    max-file: "2"

services:
  nginx:
    image: nginx:1.30.1
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3030}:3030"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - main
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:z
      - static_volume:/app/static
      - media_volume:/app/images

  db:
    image: postgres:17
    restart: unless-stopped
    shm_size: ${POSTGRES_SHM_SIZE:-128mb}
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - main

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    command: gunicorn reeltalk.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
    volumes:
      - static_volume:/app/static
      - media_volume:/app/images
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000"]
      interval: 3s
      timeout: 1s
      start_period: 3s
      retries: 25
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - main

  # Single Redis container for the whole stack:
  # DB 0 = Django cache, DB 1 = Celery broker.
  redis:
    image: redis:7.2.1
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    logging: *default-logging
    volumes:
      - redis_data:/data
    env_file: .env
    networks:
      - main
    restart: unless-stopped

  celery_worker:
    build: .
    env_file: .env
    command: celery -A celerytalk worker --pool=threads --concurrency=4 -l info
    healthcheck:
      test: ["CMD-SHELL", "celery -A celerytalk status"]
      interval: 10s
      timeout: 10s
      start_period: 2s
      retries: 6
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - main
    restart: unless-stopped

  celery_beat:
    build: .
    env_file: .env
    command: celery -A celerytalk beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    healthcheck:
      test: ["CMD-SHELL", "celery -A celerytalk status"]
      interval: 10s
      timeout: 10s
      start_period: 2s
      retries: 6
    depends_on:
      celery_worker:
        condition: service_healthy
    networks:
      - main
    restart: unless-stopped

  # Daily pg_dump job is deliberately not part of the dev stack yet;
  # it lands before public deploy (PLAN.md §5 M6).

volumes:
  pgdata:
  static_volume:
  media_volume:
  redis_data:

networks:
  main:
